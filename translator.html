<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<title>SpeakLingo — Translator</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#090912;--bg2:#0f0f1a;--card:rgba(255,255,255,0.03);
  --blue:#3B82F6;--purple:#8B5CF6;--cyan:#06B6D4;--green:#10B981;
  --red:#EF4444;--amber:#F59E0B;
  --text:#e2e8f0;--muted:#64748b;--border:rgba(255,255,255,0.07);
  --nav-h:56px;--bot-h:60px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
h1,h2,h3{font-family:'Syne',sans-serif}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 70% 50% at 10% 20%,rgba(59,130,246,0.07),transparent 60%),radial-gradient(ellipse 50% 60% at 90% 80%,rgba(139,92,246,0.07),transparent 60%)}

/* TOP NAV */
nav.top-nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:var(--nav-h);background:rgba(9,9,18,0.92);backdrop-filter:blur(24px);border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:8px;font-family:'Syne',sans-serif;font-weight:700;font-size:1rem;color:#fff;text-decoration:none}
.logo-box{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--blue),var(--purple));display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.nav-chip{font-size:.75rem;color:var(--muted);background:rgba(255,255,255,0.05);padding:4px 10px;border-radius:8px;border:1px solid var(--border)}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:50;display:flex;height:var(--bot-h);background:rgba(9,9,18,0.95);backdrop-filter:blur(24px);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px)}
.bottom-nav a,.bottom-nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:transparent;border:none;cursor:pointer;color:var(--muted);font-family:'DM Sans',sans-serif;text-decoration:none;font-size:.6rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;transition:color .2s}
.bottom-nav .active{color:var(--blue)}
.nav-icon{font-size:1.25rem;line-height:1}

/* MAIN */
main{padding-top:var(--nav-h);padding-bottom:calc(var(--bot-h) + env(safe-area-inset-bottom,0px) + 16px);min-height:100vh;display:flex;flex-direction:column;align-items:center;position:relative;z-index:1}

/* HERO */
.top-header{text-align:center;padding:18px 16px 14px}
.top-header h1{font-size:clamp(1.6rem,6vw,2.4rem);font-weight:800;letter-spacing:-.03em;margin-bottom:5px}
.grad{background:linear-gradient(135deg,var(--blue),var(--purple),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.top-header p{font-size:.82rem;color:var(--muted)}

/* TRANSLATOR WRAPPER */
.translator{width:100%;padding:0 12px}

/* LANG BAR */
.lang-bar{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:14px;padding:8px 12px;margin-bottom:10px}
.lang-select{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:.88rem;font-family:'DM Sans',sans-serif;cursor:pointer;appearance:none;min-width:0}
.lang-select option{background:#1a1a2e;color:#fff}
.swap-btn{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,0.06);border:1px solid var(--border);color:var(--muted);cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;transition:all .3s;flex-shrink:0}
.swap-btn:active{background:rgba(99,102,241,0.15);color:#fff;transform:rotate(180deg)}

/* PANELS — vertical on mobile, 2-col on wider screens */
.panels{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
@media(min-width:640px){.panels{display:grid;grid-template-columns:1fr 1fr;gap:14px}}

.panel{border-radius:16px;overflow:hidden;background:var(--card);border:1px solid var(--border);display:flex;flex-direction:column;transition:border-color .3s}
.panel:focus-within,.panel.active-in{border-color:rgba(59,130,246,0.35)}
.panel.active-out{border-color:rgba(139,92,246,0.35)}
.panel-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 8px;border-bottom:1px solid var(--border)}
.panel-lang-label{font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.panel-actions{display:flex;gap:4px}
.icon-btn{width:34px;height:34px;border-radius:8px;background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.icon-btn:active{background:rgba(255,255,255,0.07);color:#fff}
.icon-btn.copied{color:var(--green)}
.panel textarea{background:transparent;border:none;outline:none;resize:none;padding:12px 14px;font-size:1rem;color:#fff;font-family:'DM Sans',sans-serif;line-height:1.6;min-height:90px}
.panel textarea::placeholder{color:var(--muted)}
.panel-output{padding:12px 14px;font-size:1rem;line-height:1.6;min-height:76px;color:#c4b5fd;font-style:italic;white-space:pre-wrap;word-break:break-word}
.panel-output.empty{color:var(--muted);font-style:normal;font-size:.88rem}

/* MIC SECTION */
.mic-section{display:flex;flex-direction:column;align-items:center;gap:8px;margin:4px 0 14px}
.mic-ring{position:relative;width:82px;height:82px;display:flex;align-items:center;justify-content:center}
.mic-ring::before,.mic-ring::after{content:'';position:absolute;border-radius:50%;border:2px solid rgba(99,102,241,0.2);animation:mic-ripple 2s ease-out infinite;opacity:0}
.mic-ring::before{width:100%;height:100%;animation-delay:0s}
.mic-ring::after{width:130%;height:130%;animation-delay:.6s}
.mic-ring.recording::before,.mic-ring.recording::after{border-color:rgba(239,68,68,0.4);animation-duration:1.2s}
@keyframes mic-ripple{0%{transform:scale(.8);opacity:.8}100%{transform:scale(1.4);opacity:0}}
.mic-btn{width:66px;height:66px;border-radius:50%;cursor:pointer;border:none;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px rgba(99,102,241,0.35);transition:all .2s;position:relative;z-index:1}
.mic-btn:active{transform:scale(0.93)}
.mic-btn.recording{background:linear-gradient(135deg,var(--red),#ff6b6b);box-shadow:0 0 40px rgba(239,68,68,0.5)}
.mic-btn svg{width:28px;height:28px;transition:all .2s}
.mic-status{font-size:.8rem;color:var(--muted);letter-spacing:.03em;min-height:18px;text-align:center}
.mic-status.listening{color:var(--red);animation:blink .8s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.wave-wrap{display:flex;align-items:center;gap:3px;height:22px}
.wave-bar{width:3px;border-radius:3px;background:linear-gradient(to top,var(--blue),var(--purple));opacity:0;transition:opacity .3s}
.wave-wrap.active .wave-bar{opacity:.7;animation:wv 1.2s ease-in-out infinite}
.wave-bar:nth-child(1){height:6px;animation-delay:0s}.wave-bar:nth-child(2){height:12px;animation-delay:.1s}.wave-bar:nth-child(3){height:18px;animation-delay:.2s}.wave-bar:nth-child(4){height:22px;animation-delay:.3s}.wave-bar:nth-child(5){height:18px;animation-delay:.2s}.wave-bar:nth-child(6){height:12px;animation-delay:.1s}.wave-bar:nth-child(7){height:6px;animation-delay:0s}
@keyframes wv{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.8)}}

/* TRANSLATE BTN */
.translate-btn{width:100%;padding:15px;border-radius:14px;border:none;cursor:pointer;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;font-size:1rem;font-weight:600;font-family:'Syne',sans-serif;letter-spacing:.03em;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px}
.translate-btn:active{opacity:.88;transform:scale(0.98)}
.translate-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.translate-btn.loading{background:linear-gradient(135deg,#4a6cf7,#7a56e8)}
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* SAVE ROW */
.save-row{display:flex;align-items:center;gap:8px;margin-top:10px}
.save-word-btn{flex:1;padding:13px 14px;border-radius:12px;border:1px solid rgba(16,185,129,0.3);background:rgba(16,185,129,0.07);color:var(--green);font-size:.88rem;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px;transition:all .2s}
.save-word-btn:active{background:rgba(16,185,129,0.15);border-color:var(--green)}
.clear-btn{padding:13px 18px;border-radius:12px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:.88rem;cursor:pointer;min-height:48px;transition:all .2s}
.clear-btn:active{background:rgba(255,255,255,0.05);color:#fff}

/* TOAST */
.toast{position:fixed;bottom:calc(var(--bot-h) + env(safe-area-inset-bottom,0px) + 12px);left:50%;transform:translateX(-50%) translateY(20px);background:rgba(16,185,129,0.15);border:1px solid rgba(16,185,129,0.4);color:var(--green);padding:11px 22px;border-radius:12px;font-size:.88rem;font-weight:500;opacity:0;transition:all .3s;z-index:200;pointer-events:none;backdrop-filter:blur(10px);white-space:nowrap;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.error{background:rgba(239,68,68,0.15);border-color:rgba(239,68,68,0.4);color:var(--red)}

.support-note{margin:10px 12px 0;padding:12px 16px;border-radius:12px;background:rgba(245,158,11,0.07);border:1px solid rgba(245,158,11,0.2);font-size:.78rem;color:#fbbf24;text-align:center}
</style>
</head>
<body>

<nav class="top-nav">
  <a class="logo" href="translator.html">
    <div class="logo-box">🌐</div>
    SpeakLingo
  </a>
  <span class="nav-chip">🎤 Translator</span>
</nav>

<main>
  <div class="top-header">
    <h1>Voice <span class="grad">Translator</span></h1>
    <p>Speak or type — instant translation</p>
  </div>

  <div class="translator">
    <div class="lang-bar">
      <select class="lang-select" id="fromLang" onchange="updateLabels()">
        <option value="en-US" data-code="en">🇺🇸 English</option>
        <option value="ru-RU" data-code="ru">🇷🇺 Russian</option>
        <option value="es-ES" data-code="es">🇪🇸 Spanish</option>
        <option value="fr-FR" data-code="fr">🇫🇷 French</option>
        <option value="de-DE" data-code="de">🇩🇪 German</option>
        <option value="it-IT" data-code="it">🇮🇹 Italian</option>
        <option value="pt-PT" data-code="pt">🇵🇹 Portuguese</option>
        <option value="ja-JP" data-code="ja">🇯🇵 Japanese</option>
        <option value="zh-CN" data-code="zh">🇨🇳 Chinese</option>
        <option value="ko-KR" data-code="ko">🇰🇷 Korean</option>
        <option value="ar-SA" data-code="ar">🇸🇦 Arabic</option>
        <option value="tr-TR" data-code="tr">🇹🇷 Turkish</option>
        <option value="kk-KZ" data-code="kk">🇰🇿 Kazakh</option>
        <option value="uk-UA" data-code="uk">🇺🇦 Ukrainian</option>
        <option value="pl-PL" data-code="pl">🇵🇱 Polish</option>
        <option value="nl-NL" data-code="nl">🇳🇱 Dutch</option>
        <option value="hi-IN" data-code="hi">🇮🇳 Hindi</option>
      </select>
      <button class="swap-btn" onclick="swapLangs()">⇄</button>
      <select class="lang-select" id="toLang" onchange="updateLabels()">
        <option value="ru" data-bcp="ru-RU">🇷🇺 Russian</option>
        <option value="en" data-bcp="en-US">🇺🇸 English</option>
        <option value="es" data-bcp="es-ES">🇪🇸 Spanish</option>
        <option value="fr" data-bcp="fr-FR">🇫🇷 French</option>
        <option value="de" data-bcp="de-DE">🇩🇪 German</option>
        <option value="it" data-bcp="it-IT">🇮🇹 Italian</option>
        <option value="pt" data-bcp="pt-PT">🇵🇹 Portuguese</option>
        <option value="ja" data-bcp="ja-JP">🇯🇵 Japanese</option>
        <option value="zh" data-bcp="zh-CN">🇨🇳 Chinese</option>
        <option value="ko" data-bcp="ko-KR">🇰🇷 Korean</option>
        <option value="ar" data-bcp="ar-SA">🇸🇦 Arabic</option>
        <option value="tr" data-bcp="tr-TR">🇹🇷 Turkish</option>
        <option value="kk" data-bcp="kk-KZ">🇰🇿 Kazakh</option>
        <option value="uk" data-bcp="uk-UA">🇺🇦 Ukrainian</option>
        <option value="pl" data-bcp="pl-PL">🇵🇱 Polish</option>
        <option value="nl" data-bcp="nl-NL">🇳🇱 Dutch</option>
        <option value="hi" data-bcp="hi-IN">🇮🇳 Hindi</option>
      </select>
    </div>

    <div class="panels">
      <div class="panel active-in">
        <div class="panel-header">
          <span class="panel-lang-label" id="fromLabel">English</span>
          <div class="panel-actions">
            <button class="icon-btn" onclick="clearInput()">✕</button>
            <button class="icon-btn" onclick="copyText('input')" id="copyInBtn">⎘</button>
          </div>
        </div>
        <textarea id="inputText" placeholder="Type here or use the microphone…" rows="4" oninput="onInput()"></textarea>
      </div>

      <div class="panel active-out">
        <div class="panel-header">
          <span class="panel-lang-label" id="toLabel">Russian</span>
          <div class="panel-actions">
            <button class="icon-btn" onclick="speakTranslation()">▶</button>
            <button class="icon-btn" onclick="copyText('output')" id="copyOutBtn">⎘</button>
          </div>
        </div>
        <div class="panel-output empty" id="outputText">Translation will appear here…</div>
      </div>
    </div>

    <div class="mic-section">
      <div class="wave-wrap" id="waveWrap">
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div>
      </div>
      <div class="mic-ring" id="micRing">
        <button class="mic-btn" id="micBtn" onclick="toggleMic()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </button>
      </div>
      <div class="mic-status" id="micStatus">Tap mic to start speaking</div>
    </div>

    <button class="translate-btn" id="translateBtn" onclick="doTranslate()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 8l6 6"/><path d="M4 14l6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg>
      Translate
    </button>

    <div class="save-row">
      <button class="save-word-btn" onclick="saveWord()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        Save to Vocabulary
      </button>
      <button class="clear-btn" onclick="clearAll()">Clear All</button>
    </div>
  </div>

  <div class="support-note" id="supportNote" style="display:none">
    ⚠️ Speech Recognition requires Chrome or Edge. Typing still works!
  </div>
</main>

<nav class="bottom-nav">
  <button class="active">
    <span class="nav-icon">🎤</span>
    Translator
  </button>
  <a href="vocabulary.html">
    <span class="nav-icon">📚</span>
    Vocabulary
  </a>
</nav>

<div class="toast" id="toast"></div>

<script>
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null, isRecording = false, autoTranslateTimeout = null;

if (!SpeechRecognition) {
  document.getElementById('supportNote').style.display = 'block';
  document.getElementById('micBtn').style.opacity = '.4';
  document.getElementById('micBtn').disabled = true;
} else {
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.onstart = () => {
    isRecording = true;
    document.getElementById('micBtn').classList.add('recording');
    document.getElementById('micRing').classList.add('recording');
    document.getElementById('waveWrap').classList.add('active');
    document.getElementById('micStatus').textContent = '🔴 Listening...';
    document.getElementById('micStatus').className = 'mic-status listening';
  };
  recognition.onresult = (e) => {
    let interim = '', final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      e.results[i].isFinal ? final += t : interim += t;
    }
    document.getElementById('inputText').value = final || interim;
    if (final) { clearTimeout(autoTranslateTimeout); autoTranslateTimeout = setTimeout(doTranslate, 500); }
  };
  recognition.onerror = (e) => {
    stopMic();
    if (e.error === 'not-allowed') showToast('Microphone permission denied.', true);
    else if (e.error !== 'aborted') showToast('Speech error: ' + e.error, true);
  };
  recognition.onend = () => stopMic();
}

function toggleMic() { if (!recognition) return; isRecording ? recognition.stop() : startMic(); }
function startMic() { recognition.lang = document.getElementById('fromLang').value; recognition.start(); }
function stopMic() {
  isRecording = false;
  document.getElementById('micBtn').classList.remove('recording');
  document.getElementById('micRing').classList.remove('recording');
  document.getElementById('waveWrap').classList.remove('active');
  document.getElementById('micStatus').textContent = 'Tap mic to start speaking';
  document.getElementById('micStatus').className = 'mic-status';
}

async function doTranslate() {
  const text = document.getElementById('inputText').value.trim();
  if (!text) return;
  const btn = document.getElementById('translateBtn');
  const out = document.getElementById('outputText');
  const fromSel = document.getElementById('fromLang');
  const toSel = document.getElementById('toLang');
  const fromCode = fromSel.options[fromSel.selectedIndex].dataset.code || fromSel.value.split('-')[0];
  const toCode = toSel.value;
  btn.disabled = true; btn.classList.add('loading');
  btn.innerHTML = '<div class="spinner"></div> Translating…';
  out.className = 'panel-output empty'; out.textContent = 'Translating…';
  try {
    const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${fromCode}|${toCode}`);
    const data = await res.json();
    if (data.responseStatus === 200 && data.responseData?.translatedText) {
      const translated = data.responseData.translatedText;
      out.className = 'panel-output'; out.textContent = translated;
      window._lastTranslation = { original: text, translated, fromCode, toCode };
    } else throw new Error(data.responseDetails || 'Translation failed');
  } catch (err) {
    out.className = 'panel-output empty'; out.textContent = '⚠ Translation failed. Check your connection.';
    showToast('Error: ' + err.message, true);
  }
  btn.disabled = false; btn.classList.remove('loading');
  btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 8l6 6"/><path d="M4 14l6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg> Translate`;
}

function speakTranslation() {
  const text = document.getElementById('outputText').textContent;
  if (!text || text.includes('Translation will') || text.includes('Translating')) return;
  const toSel = document.getElementById('toLang');
  const bcp = toSel.options[toSel.selectedIndex].dataset.bcp || toSel.value;
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = bcp; window.speechSynthesis.cancel(); window.speechSynthesis.speak(utter);
  showToast('🔊 Playing translation…');
}

function saveWord() {
  const last = window._lastTranslation;
  if (!last) { showToast('Translate something first!', true); return; }
  const vocab = JSON.parse(localStorage.getItem('speaklingo_vocab') || '[]');
  if (vocab.some(v => v.original === last.original && v.translated === last.translated)) { showToast('Already in vocabulary!'); return; }
  vocab.push({ ...last, id: Date.now(), timestamp: new Date().toISOString(), starred: false });
  localStorage.setItem('speaklingo_vocab', JSON.stringify(vocab));
  showToast('✅ Saved to Vocabulary!');
}

function copyText(which) {
  const text = which === 'input' ? document.getElementById('inputText').value : document.getElementById('outputText').textContent;
  if (!text || text.includes('Translation will')) return;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById(which === 'input' ? 'copyInBtn' : 'copyOutBtn');
    btn.classList.add('copied'); btn.textContent = '✓';
    setTimeout(() => { btn.classList.remove('copied'); btn.textContent = '⎘'; }, 1500);
    showToast('Copied!');
  });
}

function clearInput() { document.getElementById('inputText').value = ''; }
function clearAll() {
  document.getElementById('inputText').value = '';
  const out = document.getElementById('outputText');
  out.className = 'panel-output empty'; out.textContent = 'Translation will appear here…';
  window._lastTranslation = null;
}

function swapLangs() {
  const fromSel = document.getElementById('fromLang'), toSel = document.getElementById('toLang');
  const fromCode = fromSel.options[fromSel.selectedIndex].dataset.code;
  const toCode = toSel.value;
  for (let i = 0; i < fromSel.options.length; i++) { if (fromSel.options[i].dataset.code === toCode) { fromSel.selectedIndex = i; break; } }
  for (let i = 0; i < toSel.options.length; i++) { if (toSel.options[i].value === fromCode) { toSel.selectedIndex = i; break; } }
  updateLabels();
}

function updateLabels() {
  const fromSel = document.getElementById('fromLang'), toSel = document.getElementById('toLang');
  document.getElementById('fromLabel').textContent = fromSel.options[fromSel.selectedIndex].text.replace(/^.{2}\s/,'');
  document.getElementById('toLabel').textContent = toSel.options[toSel.selectedIndex].text.replace(/^.{2}\s/,'');
}

function onInput() { clearTimeout(autoTranslateTimeout); autoTranslateTimeout = setTimeout(doTranslate, 1200); }

function showToast(msg, isError=false) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => { t.className = 'toast'; }, 3000);
}

updateLabels();
</script>
</body>
</html>
